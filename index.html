<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AquaMonitor IoT</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-container">

        <div class="login-card">

            <h1>AquaMonitor IoT</h1>

            <p>Acceso al sistema de monitoreo</p>

            <form id="loginForm">

                <div>
                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="correo@ejemplo.com"
                        required
                    >
                </div>

                <div>
                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Contraseña"
                        required
                    >
                </div>

                <button type="submit">
                    Ingresar
                </button>

                <p id="loginMessage"></p>

            </form>

        </div>

    </main>

    <script type="module" src="js/app.js"></script>

</body>

</html>
